[pytest]
testpaths = tests
pythonpath = .
# Python-level capture. The default fd capture redirects the process's
# standard handles, and on Windows Python 3.12+ Tk then intermittently fails
# to load tk.tcl ("Can't find a usable tk.tcl"): 3 of 8 runs locally, the
# 3.12/3.13 CI jobs. 0 of 12 with --capture=sys.
addopts = --capture=sys
