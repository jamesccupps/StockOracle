name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The app ships for Windows (tkinter GUI, .bat launchers, msvcrt file locks)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: stock_oracle/requirements.txt
      - name: Install
        run: python -m pip install -r stock_oracle/requirements.txt pytest
      - name: Resolved versions
        run: python -m pip freeze
      - name: Test
        run: python -m pytest -q
