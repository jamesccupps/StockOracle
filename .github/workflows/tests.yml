name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The app ships for Windows (tkinter GUI, .bat launchers, msvcrt file locks)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: stock_oracle/requirements.txt
      - name: Install
        run: python -m pip install -r stock_oracle/requirements.txt pytest
      - name: Resolved versions
        run: python -m pip freeze
      - name: Test
        run: python -m pytest -q
