name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # The app ships for Windows (tkinter GUI, .bat launchers, msvcrt file locks)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: stock_oracle/requirements.txt
      - name: Install
        run: python -m pip install -r stock_oracle/requirements.txt pytest
      - name: Resolved versions
        run: python -m pip freeze
      - name: Test
        # bash on the Windows runner: -o pipefail keeps pytest's exit code
        # through tee, and the full output is kept for the report step
        shell: bash
        run: python -m pytest -q -rfE --junitxml=pytest-report.xml 2>&1 | tee pytest-output.txt
      # Failing tests as annotations, so they show on the run's summary page
      # (and in the public API) without opening the log
      - name: Report failures
        if: failure()
        shell: python
        run: |
          import os, sys
          import xml.etree.ElementTree as ET
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          def esc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          emitted = 0
          if os.path.exists("pytest-report.xml"):
              for case in ET.parse("pytest-report.xml").getroot().iter("testcase"):
                  for kind in ("failure", "error"):
                      el = case.find(kind)
                      if el is None:
                          continue
                      lines = (el.text or "").strip().splitlines()
                      detail = "\n".join(lines[-25:])[:3000]
                      name = f"{case.get('classname')}.{case.get('name')} ({kind})"
                      print(f"::error title={esc(name)}::{esc((el.get('message') or '')[:500] + chr(10) + detail)}")
                      emitted += 1
          if not emitted:
              # No per-test failure recorded (pytest crashed, or failed outside a test)
              out = ["(no pytest output captured)"]
              if os.path.exists("pytest-output.txt"):
                  with open("pytest-output.txt", encoding="utf-8", errors="replace") as f:
                      out = f.read().splitlines()
              # A hard crash prints a faulthandler dump: the crashing thread
              # comes first, so post the start of the dump, then the tail
              start = next((i for i, l in enumerate(out)
                            if "fatal exception" in l.lower() or "Fatal Python error" in l), None)
              if start is not None:
                  print(f"::error title=crash dump (head)::{esc(chr(10).join(out[start:start + 45])[:4000])}")
              print(f"::error title=pytest output tail::{esc(chr(10).join(out[-60:])[-4000:])}")
